name: Build Shiv Sales APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir build-src
          unzip -q ShivSalesStockManager_v1_source.zip -d build-src

      - name: Fix Java and Kotlin JVM targets
        run: |
          cat >> build-src/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build APK
        run: |
          ./gradle-8.10.2/bin/gradle -p build-src assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiv-Sales-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
